name: Update watchlist and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *"   # every day 11:17 UTC (about 6am ET)
  workflow_dispatch:         # lets you click "Run workflow" by hand

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest trial data from ClinicalTrials.gov
        run: python update_watchlist.py
        continue-on-error: true

      - name: Save the new data back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git add watchlist.json snapshots
          git diff --cached --quiet || (git commit -m "Update watchlist snapshot" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
